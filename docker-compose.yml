version: "3.7"

# Port exposure note: this stack holds depression biomarkers (PHI). Internal
# data-plane / inter-service ports (Mongo, Mongo Express, MQTT, and the layer APIs)
# are bound to 127.0.0.1 so they are reachable from the host (and via SSH tunnel) but
# NOT exposed on the LAN. Services talk to each other over the Docker network by name
# (e.g. http://analysis_layer:8083, mongodb://mongodb:27017), which is unaffected. Only
# the dashboard (users) and the respeaker TCP server (ESP32 boards) stay LAN-public.
#
# Authentication: Mongo and MQTT now REQUIRE credentials. The secrets live in a gitignored
# .env file (MONGO_USER/MONGO_PASS/MQTT_USER/MQTT_PASS); see .env.example. The Mongo URI and
# MQTT username/password are injected into every service from those variables below.

# Shared credential env injected into services (map-merged via YAML anchors).
x-mongo-env: &mongo-env
  MONGO_URL: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/?authSource=admin"
  MONGO_URI: "mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/?authSource=admin"

x-mqtt-env: &mqtt-env
  MQTT_HOST: mqtt
  MQTT_PORT: "1883"
  MQTT_USER: "${MQTT_USER}"
  MQTT_PASS: "${MQTT_PASS}"

services:
   mqtt:
      image: eclipse-mosquitto
      restart: unless-stopped
      ports:
         - "1883:1883"   # LAN-exposed for edge nodes (auth + ACLs enforced; 2026-07-09)
      volumes:
         - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
         - ./mosquitto.passwd:/mosquitto/config/passwd:ro
         - ./mosquitto.acl:/mosquitto/config/acl:ro

   mongodb:
      image: mongo:latest
      container_name: mongodb
      restart: unless-stopped
      ports:
         - "127.0.0.1:27017:27017"
      volumes:
         - mongo_data:/data/db
      environment:
         # On a FRESH volume the entrypoint creates this root user and enables auth. On an
         # EXISTING volume the user must be created once manually (see scripts/setup_mongo_auth.sh);
         # either way --auth below enforces authentication.
         MONGO_INITDB_ROOT_USERNAME: "${MONGO_USER}"
         MONGO_INITDB_ROOT_PASSWORD: "${MONGO_PASS}"
      command: mongod --auth --setParameter diagnosticDataCollectionEnabled=false

   mongo-express:
      image: mongo-express
      restart: unless-stopped
      ports:
         - "127.0.0.1:8081:8081"
      environment:
         ME_CONFIG_MONGODB_SERVER: mongodb
         ME_CONFIG_MONGODB_ADMINUSERNAME: "${MONGO_USER}"
         ME_CONFIG_MONGODB_ADMINPASSWORD: "${MONGO_PASS}"
         ME_CONFIG_MONGODB_AUTH_DATABASE: admin
         ME_CONFIG_BASICAUTH_USERNAME: "${MONGO_USER}"
         ME_CONFIG_BASICAUTH_PASSWORD: "${MONGO_PASS}"
      depends_on:
         - mongodb

   voice_profiling:
      build:
         context: ./processing_layer/user_profiling/voice_profiling
         dockerfile: Dockerfile
      restart: unless-stopped
      ports:
         - "127.0.0.1:8000:8000"
      volumes:
         - ./processing_layer/user_profiling/voice_profiling:/app
      environment:
         <<: *mongo-env
      depends_on:
         - mongodb

   voice_metrics:
      build:
         context: ./processing_layer/metrics_computation/voice_metrics
         dockerfile: Dockerfile
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 2G
      environment:
         <<: [*mongo-env, *mqtt-env]
         SYSTEM_MODE: live
      volumes:
         - ./processing_layer/metrics_computation/voice_metrics:/app
         - ./processing_layer/scene_analysis:/app/processing_layer/scene_analysis:ro
         - ./processing_layer/user_profiling/voice_profiling:/app/processing_layer/user_profiling/voice_profiling:ro
      depends_on:
         - mqtt
         - voice_profiling
         - mongodb

   respeaker_service:
      build:
         context: ./data_ingestion_layer
         dockerfile: Dockerfile.respeaker
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 512M
            reservations:
               memory: 256M
      ports:
         - "8010:8010"
      volumes:
         - ./data_ingestion_layer:/app
         - ./datasets:/app/datasets:ro
      depends_on:
         - mqtt
         - mongodb
      environment:
         <<: [*mongo-env, *mqtt-env]
         BASE_PORT: "8010"

   quality_metrics_service:
      build:
         context: ./data_ingestion_layer
         dockerfile: Dockerfile.respeaker
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 256M
      command: python quality_metrics_service.py
      volumes:
         - ./data_ingestion_layer:/app
      depends_on:
         - mqtt
         - mongodb
      environment:
         <<: [*mongo-env, *mqtt-env]

   node_registry_service:
      build:
         context: ./data_ingestion_layer
         dockerfile: Dockerfile.respeaker
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 256M
      command: python node_registry_service.py
      volumes:
         - ./data_ingestion_layer:/app
      depends_on:
         - mqtt
         - mongodb
      environment:
         <<: [*mongo-env, *mqtt-env]

   temporal_context_modeling_layer:
      build:
         context: ./temporal_context_modeling_layer
         dockerfile: Dockerfile
      restart: unless-stopped
      ports:
         - "127.0.0.1:8082:8082"
      environment:
         <<: *mongo-env
      depends_on:
         - mongodb

   analysis_layer:
      build:
         context: ./analysis_layer
         dockerfile: Dockerfile
      restart: unless-stopped
      deploy:
         resources:
            limits:
               memory: 1G
      ports:
         - "127.0.0.1:8083:8083"
      environment:
         <<: *mongo-env
      depends_on:
         - mongodb

   dashboard_layer:
      build:
         context: ./dashboard_layer
         dockerfile: Dockerfile
      restart: unless-stopped
      ports:
         - "8084:8084"
      volumes:
         - ./analysis_layer/core:/app/core:ro
         - ./datasets:/app/datasets:ro
         - ./data_ingestion_layer:/app/data_ingestion_layer:ro
         - ./processing_layer/scene_analysis:/app/processing_layer/scene_analysis:ro
         - ./docs:/app/docs:ro
      environment:
         <<: [*mongo-env, *mqtt-env]
         PYTHONUNBUFFERED: "1"
      depends_on:
         - mongodb

volumes:
   mongo_data:
      # Pin the volume name so the stack reuses the existing data volume regardless of the
      # compose project/directory name. Without this, a project named "audio-depression-
      # detection" creates a fresh "audio-depression-detection_mongo_data" and the stack
      # starts with an EMPTY database instead of the existing demo/dataset/live data.
      name: depression-detection_mongo_data
